</style><script src="learning-core.js?v=20261015-beginner1"></script><script src="spanish-answer-check.js?v=20261015-beginner1"></script><script defer src="spanish-navigation.js?v=20261015-beginner1"></script></head><body><nav id="navbar"><a href="main.html">Spanisch lernen</a><a href="main.html#hero">Startseite</a></nav><main id="beginnerApp"><h1>Dein Einstieg wird geladen …</h1><p>Sechs kurze Lektionen ohne Vorkenntnisse.</p></main><script id="spanishBeginnerData" type="application/json">[{"title": "Begrüssen und sich vorstellen", "goal": "Du kannst jemanden begrüssen und deinen Namen sagen.", "vocab": [["¡Hola!", "Hallo!"], ["Buenos días.", "Guten Morgen."], ["Me llamo Ana.", "Ich heisse Ana."], ["¿Cómo te llamas?", "Wie heisst du?"]], "dialog": [["Ana", "¡Hola! Me llamo Ana. ¿Cómo te llamas?", "Hallo! Ich heisse Ana. Wie heisst du?"], ["Luis", "Hola, me llamo Luis.", "Hallo, ich heisse Luis."]], "rule": "Mit „Me llamo …“ sagst du deinen Namen. Lerne den Ausdruck zunächst als ganzen Baustein. Für „Hallo“ kannst du „Hola“ verwenden.", "choices": [{"q": "Wie begrüsst du jemanden mit „Hallo“?", "options": ["¡Hola!", "Gracias.", "Adiós."], "answer": "¡Hola!", "why": "„Hola“ bedeutet „Hallo“. „Gracias“ heisst „Danke“, „Adiós“ heisst „Auf Wiedersehen“."}, {"q": "Welcher Satz bedeutet „Ich heisse Ana“?", "options": ["Me llamo Ana.", "Te llamas Ana.", "¿Cómo te llamas?"], "answer": "Me llamo Ana.", "why": "„Me llamo“ verwendest du für deinen eigenen Namen. „Te llamas“ bezieht sich auf die andere Person."}], "write": {"q": "Ergänze das fehlende Wort: Ich heisse Ana.", "ctx": "Me ___ Ana.", "answer": "llamo", "why": "Der ganze Satz lautet „Me llamo Ana.“"}, "personal": "Sage laut Hallo und stelle dich mit deinem eigenen Vornamen vor.", "model": "¡Hola! Me llamo Ana.", "vocabularyTip": true}, {"title": "Nach dem Befinden fragen", "goal": "Du kannst nach dem Befinden fragen und kurz antworten.", "vocab": [["¿Cómo estás?", "Wie geht es dir?"], ["Estoy bien.", "Mir geht es gut."], ["Estoy mal.", "Mir geht es schlecht."], ["Gracias. ¿Y tú?", "Danke. Und dir?"]], "dialog": [["Ana", "Hola, Luis. ¿Cómo estás?", "Hallo, Luis. Wie geht es dir?"], ["Luis", "Estoy bien, gracias. ¿Y tú?", "Mir geht es gut, danke. Und dir?"]], "rule": "„¿Cómo estás?“ ist eine Frage an eine Person, die du duzt. Mit „Estoy …“ beschreibst du hier dein Befinden. „Estoy“ und „estás“ sind Formen von „estar“. Du brauchst noch keine vollständige Verbtabelle.", "choices": [{"q": "Wie fragst du „Wie geht es dir“?", "options": ["¿Cómo estás?", "¿Cómo te llamas?", "Buenos días."], "answer": "¿Cómo estás?", "why": "„¿Cómo estás?“ fragt nach dem Befinden; „¿Cómo te llamas?“ fragt nach dem Namen."}, {"q": "Welche Antwort bedeutet „Mir geht es gut“?", "options": ["Estoy bien.", "Estoy mal.", "Me llamo Ana."], "answer": "Estoy bien.", "why": "„Bien“ bedeutet hier „gut“. „Estoy mal“ bedeutet „Mir geht es schlecht“."}], "write": {"q": "Ergänze: Mir geht es gut.", "ctx": "___ bien.", "answer": "Estoy", "why": "„Estoy bien“ ist eine vollständige kurze Antwort auf „¿Cómo estás?“. Ein zusätzliches „yo“ ist nicht nötig."}, "personal": "Frage laut nach dem Befinden. Antworte so, wie es dir gerade geht, und bedanke dich.", "model": "¿Cómo estás? — Estoy bien, gracias."}, {"title": "Zahlen und Alter", "goal": "Du kannst einige Zahlen verstehen und dein Alter nennen.", "vocab": [["uno, dos, tres, cuatro, cinco", "eins, zwei, drei, vier, fünf"], ["seis, siete, ocho, nueve, diez", "sechs, sieben, acht, neun, zehn"], ["veinte, veintiuno, veintidós", "zwanzig, einundzwanzig, zweiundzwanzig"], ["Tengo veinte años.", "Ich bin zwanzig Jahre alt."], ["¿Cuántos años tienes?", "Wie alt bist du?"]], "dialog": [["Ana", "¿Cuántos años tienes?", "Wie alt bist du?"], ["Luis", "Tengo veinte años. ¿Y tú?", "Ich bin zwanzig Jahre alt. Und du?"], ["Ana", "Tengo veintidós años.", "Ich bin zweiundzwanzig Jahre alt."]], "rule": "Beim Alter verwendet Spanisch „tener“ (haben): „Tengo veinte años.“ Wörtlich bedeutet das „Ich habe zwanzig Jahre“. „Tengo“ ist die Form für „ich“, „tienes“ für „du“.", "choices": [{"q": "Welche Zahl bedeutet „drei“?", "options": ["tres", "dos", "diez"], "answer": "tres", "why": "„Tres“ heisst „drei“, „dos“ heisst „zwei“ und „diez“ heisst „zehn“."}, {"q": "Welcher Satz bedeutet „Ich bin zwanzig Jahre alt“?", "options": ["Tengo veinte años.", "Estoy veinte años.", "Me llamo veinte."], "answer": "Tengo veinte años.", "why": "Für das Alter brauchst du „tengo“, nicht „estoy“."}], "write": {"q": "Ergänze: Ich bin zwanzig Jahre alt.", "ctx": "___ veinte años.", "answer": "Tengo", "why": "Der Satz lautet „Tengo veinte años.“"}, "personal": "Sage dein Alter. Du darfst eine Zahl aus den Beispielen benutzen. Für andere Zahlen hilft die Zahlenübersicht.", "model": "Tengo veinte años.", "numbers": true}, {"title": "Über Familie sprechen", "goal": "Du kannst eine Person aus deiner Familie vorstellen.", "vocab": [["mi madre", "meine Mutter"], ["mi padre", "mein Vater"], ["mi hermana", "meine Schwester"], ["mi hermano", "mein Bruder"], ["Esta es mi hermana.", "Das ist meine Schwester."]], "dialog": [["Ana", "Esta es mi hermana. Se llama Sara.", "Das ist meine Schwester. Sie heisst Sara."], ["Luis", "Hola, Sara.", "Hallo, Sara."]], "rule": "„Mi“ bedeutet „mein“ oder „meine“ vor einem einzelnen Familienwort: „mi hermano“, „mi hermana“. „Esta es …“ stellt hier eine weibliche Person vor, „Este es …“ eine männliche. „Es“ ist eine Form von „ser“.", "choices": [{"q": "Was bedeutet „mi madre“?", "options": ["meine Mutter", "mein Bruder", "meine Schwester"], "answer": "meine Mutter", "why": "„Madre“ bedeutet „Mutter“. „Hermano“ ist „Bruder“, „hermana“ ist „Schwester“."}, {"q": "Wie stellst du deinen Bruder vor?", "options": ["Este es mi hermano.", "Esta es mi hermana.", "Estoy bien."], "answer": "Este es mi hermano.", "why": "„Este es mi hermano“ bedeutet „Das ist mein Bruder“."}], "write": {"q": "Ergänze: Das ist meine Schwester.", "ctx": "Esta ___ mi hermana.", "answer": "es", "why": "Hier steht „es“, eine Form von „ser“. Du stellst eine Person vor, statt ihr aktuelles Befinden zu beschreiben."}, "personal": "Stelle eine Person aus deiner Familie vor. Du kannst auch eine Person erfinden.", "model": "Esta es mi hermana. Se llama Sara."}, {"title": "Einfache Wünsche ausdrücken", "goal": "Du kannst höflich um etwas bitten und dich bedanken.", "vocab": [["Quiero agua.", "Ich möchte Wasser."], ["un café", "einen Kaffee"], ["por favor", "bitte"], ["gracias", "danke"], ["Quisiera un café.", "Ich hätte gern einen Kaffee."]], "dialog": [["Ana", "Hola. Quisiera un café, por favor.", "Hallo. Ich hätte gern einen Kaffee, bitte."], ["Luis", "Aquí tienes.", "Hier, bitte."], ["Ana", "Gracias.", "Danke."]], "rule": "„Quiero …“ bedeutet „Ich will/möchte …“. Mit „por favor“ bittest du höflich. „Quisiera …“ ist eine besonders höfliche Möglichkeit; du kannst sie zunächst als festen Ausdruck lernen. „Un“ heisst hier „ein/einen“.", "choices": [{"q": "Welcher Ausdruck bedeutet „bitte“?", "options": ["por favor", "gracias", "buenos días"], "answer": "por favor", "why": "Bei einer Bitte sagst du „por favor“. Mit „gracias“ bedankst du dich."}, {"q": "Wie bestellst du höflich einen Kaffee?", "options": ["Quisiera un café, por favor.", "Me llamo café.", "Tengo veinte años."], "answer": "Quisiera un café, por favor.", "why": "„Quisiera un café, por favor“ ist eine höfliche Bestellung."}], "write": {"q": "Ergänze die höfliche Bitte um Wasser.", "ctx": "Quiero agua, por ___.", "answer": "favor", "why": "„Por favor“ ist ein fester Ausdruck für „bitte“."}, "personal": "Bitte laut um Wasser oder einen Kaffee und bedanke dich.", "model": "Quisiera un café, por favor. Gracias."}, {"title": "Dein erster kurzer Dialog", "goal": "Du verbindest Begrüssung, Name, Befinden und eine Bitte.", "vocab": [["¡Hola! Me llamo Ana.", "Hallo! Ich heisse Ana."], ["Estoy bien, gracias.", "Mir geht es gut, danke."], ["¿Y tú?", "Und du?"], ["Quisiera agua, por favor.", "Ich hätte gern Wasser, bitte."]], "dialog": [["Ana", "¡Hola! Me llamo Ana. ¿Cómo te llamas?", "Hallo! Ich heisse Ana. Wie heisst du?"], ["Luis", "Me llamo Luis. ¿Cómo estás?", "Ich heisse Luis. Wie geht es dir?"], ["Ana", "Estoy bien, gracias. ¿Y tú?", "Mir geht es gut, danke. Und dir?"], ["Luis", "Bien, gracias.", "Gut, danke."], ["Ana", "Quisiera agua, por favor.", "Ich hätte gern Wasser, bitte."]], "rule": "Du kennst bereits mehrere Satzbausteine. „Me llamo“ nennt deinen Namen, „estoy“ beschreibt dein Befinden, „tengo“ nennt dein Alter und „es“ stellt jemanden vor. Du musst noch keine vollständigen Verbtabellen auswendig können.", "choices": [{"q": "Wie heisst die zweite Person im Dialog?", "options": ["Luis", "Ana", "Sara"], "answer": "Luis", "why": "Die zweite Person sagt „Me llamo Luis“. Du findest die Antwort im Dialog."}, {"q": "Worum bittet Ana am Schluss?", "options": ["um Wasser", "um Kaffee", "um eine Fahrkarte"], "answer": "um Wasser", "why": "Ana sagt „Quisiera agua, por favor.“ „Agua“ bedeutet „Wasser“."}], "write": {"q": "Ergänze: Mir geht es gut, danke.", "ctx": "Estoy bien, ___.", "answer": "gracias", "why": "Mit „gracias“ bedankst du dich."}, "personal": "Sprich einen kurzen Dialog: Begrüsse jemanden, nenne deinen Namen, frage nach dem Befinden und formuliere eine Bitte. Du kannst beide Rollen selbst sprechen.", "model": "¡Hola! Me llamo Ana. ¿Cómo estás? — Estoy bien, gracias. Quisiera agua, por favor."}]</script><script src="spanisch-start-bei-null.js?v=20261015-8"></script></body></html>
