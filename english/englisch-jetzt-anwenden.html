 soll das T-Shirt haben? Antworte auf Englisch.", "answer": ["blue"], "explanation": "Suche die Angabe direkt im Dialog und beachte die Frage."}, "prompt": "Bitte um eine passende Grösse und frage nach Preis oder Umtausch.", "model": "How much is it? I am looking for a blue T-shirt.", "theory": "englisch-theorie-alltag-einkaufen.html#niveau-1"}, {"key": "reisen", "title": "Reisen", "dialogue": "A: I would like a ticket to York, please.\nB: The next train leaves at ten.\nA: When does it arrive?\nB: At eleven.", "audio": "audio/jetzt-anwenden/en-reisen-01.mp3", "q": {"q": "Wann fährt der Zug ab? Antworte mit einer Zahl.", "answer": ["ten", "10"], "explanation": "Suche die Angabe direkt im Dialog und beachte die Frage."}, "prompt": "Erkläre einen Reiseplan und bitte um eine wichtige Information.", "model": "Where is the station? I would like a ticket to London.", "theory": "englisch-theorie-alltag-reisen.html#niveau-1"}]};</script><script src="english-apply.js?v=20261017-1"></script></body></html>
