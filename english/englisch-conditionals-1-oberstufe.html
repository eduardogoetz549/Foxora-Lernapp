n.", "ctx": "If he studies, he will ___ the test. (pass)", "answer": "pass", "explanation": "Nach will steht pass."}, {"id": "7", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "If they ___ late, we will start without them. (be)", "answer": "are", "explanation": "Zu they gehört im if-Satz are."}, {"id": "8", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "You will feel better if you ___ some rest. (get)", "answer": "get", "explanation": "Im if-Satz steht Present Simple."}], "theory": "englisch-theorie-conditionals.html#niveau-1", "next": "englisch-be-have-1-oberstufe.html", "nextReason": "Hier erweiterst du deine Grammatik mit Be & have."};</script><script src="english-engine.js?v=en1"></script></body></html>
