n yours. (big)", "answer": "bigger", "explanation": "Bei big wird der Endkonsonant verdoppelt."}, {"id": "7", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "This exercise is ___ than the last one. (easy)", "answer": "easier", "explanation": "Konsonant plus y wird im Komparativ zu -ier."}, {"id": "8", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "This is the most ___ picture. (beautiful)", "answer": "beautiful", "explanation": "Beautiful bildet den Superlativ mit most."}], "theory": "englisch-theorie-adjectives-adverbs.html#niveau-1", "next": "englisch-pronouns-prepositions-1-oberstufe.html", "nextReason": "Hier erweiterst du deine Grammatik mit Pronomen & Präpositionen."};</script><script src="english-engine.js?v=en1"></script></body></html>
