et the smallest."}, {"id": "3", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "A cheetah is ___ than a cat. (fast)", "answer": "faster", "explanation": "Der Komparativ von fast lautet faster."}, {"id": "4", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "This book is more ___ than that one. (interesting)", "answer": "interesting", "explanation": "Bei langen Adjektiven steht more vor der unveränderten Form."}, {"id": "5", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "Today is ___ than yesterday. (cold)", "answer": "colder", "explanation": "Cold wird im Komparativ zu colder."}, {"id": "6", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "My room is ___ than yours. (big)", "answer": "bigger", "explanation": "Bei big wird der Endkonsonant verdoppelt."}, {"id": "7", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "This exercise is ___ than the last one. (easy)", "answer": "easier", "explanation": "Konsonant plus y wird im Komparativ zu -ier."}, {"id": "8", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "This is the most ___ picture. (beautiful)", "answer": "beautiful", "explanation": "Beautiful bildet den Superlativ mit most."}], "theory": "englisch-theorie-adjectives-adverbs.html#niveau-1", "next": "englisch-pronouns-prepositions-1-oberstufe.html", "nextReason": "Hier erweiterst du deine Grammatik mit Pronomen & Präpositionen."};</script><script src="english-engine.js?v=20261017-1"></script></body></html>
