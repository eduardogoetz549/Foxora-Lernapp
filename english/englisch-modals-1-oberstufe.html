": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "You should not ___ here. (smoke)", "answer": "smoke", "explanation": "Should not smoke ist ein Rat oder eine Empfehlung."}, {"id": "8", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "He must ___ careful. (be)", "answer": "be", "explanation": "Nach must steht be."}], "theory": "englisch-theorie-modals.html#niveau-1", "next": "englisch-conditionals-1-oberstufe.html", "nextReason": "Hier erweiterst du deine Grammatik mit Bedingungssätze."};</script><script src="english-engine.js?v=en1"></script></body></html>
