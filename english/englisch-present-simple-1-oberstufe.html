nze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "He ___ television in the evening. (watch)", "answer": "watches", "explanation": "Nach -ch steht -es: watches."}, {"id": "4", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "We ___ in St. Gallen. (live)", "answer": "live", "explanation": "Zu we steht live."}, {"id": "5", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "My brother ___ to work by bus. (go)", "answer": "goes", "explanation": "In der dritten Person wird go zu goes."}, {"id": "6", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "They ___ English. (study)", "answer": "study", "explanation": "Zu they steht die Grundform study."}, {"id": "7", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "Anna ___ English. (study)", "answer": "studies", "explanation": "Konsonant plus y wird bei she zu -ies."}, {"id": "8", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "The sun ___ in the east. (rise)", "answer": "rises", "explanation": "Allgemeine Tatsache, dritte Person Singular: rises."}], "theory": "englisch-theorie-present-simple.html#niveau-1", "next": "englisch-present-continuous-1-oberstufe.html", "nextReason": "Hier erweiterst du deine Grammatik mit Present Continuous."};</script><script src="english-engine.js?v=20261017-1"></script></body></html>
