gänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "Anna ___ English. (study)", "answer": "studies", "explanation": "Konsonant plus y wird bei she zu -ies."}, {"id": "8", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "The sun ___ in the east. (rise)", "answer": "rises", "explanation": "Allgemeine Tatsache, dritte Person Singular: rises."}], "theory": "englisch-theorie-present-simple.html#niveau-1", "next": "englisch-present-continuous-1-oberstufe.html", "nextReason": "Hier erweiterst du deine Grammatik mit Present Continuous."};</script><script src="english-engine.js?v=en1"></script></body></html>
