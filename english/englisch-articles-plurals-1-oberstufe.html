lmässige Pluralform."}, {"id": "7", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "One box, three ___. (box)", "answer": "boxes", "explanation": "Nach -x steht im Plural -es."}, {"id": "8", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "One city, two ___. (city)", "answer": "cities", "explanation": "Nach Konsonant plus y wird y im Plural zu -ies."}], "theory": "englisch-theorie-articles-plurals.html#niveau-1", "next": "englisch-adjectives-adverbs-1-oberstufe.html", "nextReason": "Hier erweiterst du deine Grammatik mit Adjektive & Adverbien."};</script><script src="english-engine.js?v=en1"></script></body></html>
