, {"id": "3", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "This is ___ umbrella. (a/an)", "answer": "an", "explanation": "Vor dem Vokallaut in umbrella steht an."}, {"id": "4", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "He is ___ teacher. (a/an)", "answer": "a", "explanation": "Berufe stehen im Singular normalerweise mit a oder an."}, {"id": "5", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "One book, two ___. (book)", "answer": "books", "explanation": "Der regelmässige Plural erhält -s."}, {"id": "6", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "One child, two ___. (child)", "answer": "children", "explanation": "Children ist eine unregelmässige Pluralform."}, {"id": "7", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "One box, three ___. (box)", "answer": "boxes", "explanation": "Nach -x steht im Plural -es."}, {"id": "8", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "One city, two ___. (city)", "answer": "cities", "explanation": "Nach Konsonant plus y wird y im Plural zu -ies."}], "theory": "englisch-theorie-articles-plurals.html#niveau-1", "next": "englisch-adjectives-adverbs-1-oberstufe.html", "nextReason": "Hier erweiterst du deine Grammatik mit Adjektive & Adverbien."};</script><script src="english-engine.js?v=20261017-1"></script></body></html>
