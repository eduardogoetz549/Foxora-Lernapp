 Lücke. Beachte den Hinweis in Klammern.", "ctx": "We ___ to London last year. (go)", "answer": "went", "explanation": "Went ist die unregelmässige Vergangenheit von go."}, {"id": "4", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "He ___ pizza last night. (eat)", "answer": "ate", "explanation": "Ate ist die Vergangenheit von eat."}, {"id": "5", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "They ___ a film yesterday. (watch)", "answer": "watched", "explanation": "Die regelmässige Form lautet watched."}, {"id": "6", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "I ___ my friend last week. (see)", "answer": "saw", "explanation": "Saw ist die Vergangenheit von see."}, {"id": "7", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "She ___ at home yesterday. (be)", "answer": "was", "explanation": "Zu she gehört was."}, {"id": "8", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "We ___ happy yesterday. (be)", "answer": "were", "explanation": "Zu we gehört were."}], "theory": "englisch-theorie-past-simple.html#niveau-1", "next": "englisch-past-continuous-1-oberstufe.html", "nextReason": "Hier erweiterst du deine Grammatik mit Past Continuous."};</script><script src="english-engine.js?v=20261017-1"></script></body></html>
