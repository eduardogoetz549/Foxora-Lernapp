e den Hinweis in Klammern.", "ctx": "She has ___ a new bag. (buy)", "answer": "bought", "explanation": "Bought ist das Partizip von buy."}, {"id": "8", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "We have ___ to Italy. (be)", "answer": "been", "explanation": "Been ist das Partizip von be."}], "theory": "englisch-theorie-present-perfect.html#niveau-1", "next": "englisch-future-1-oberstufe.html", "nextReason": "Hier erweiterst du deine Grammatik mit Über die Zukunft sprechen."};</script><script src="english-engine.js?v=en1"></script></body></html>
