änze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "Does she ___ football? (play)", "answer": "play", "explanation": "Nach does steht die Grundform play."}, {"id": "4", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "___ they at school? (be, Präsens)", "answer": "Are", "explanation": "Bei be fragst du direkt mit Are they …?"}, {"id": "5", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "I ___ not like coffee. (do/does)", "answer": "do", "explanation": "Die Verneinung lautet I do not like."}, {"id": "6", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "She ___ not eat meat. (do/does)", "answer": "does", "explanation": "Zu she gehört does not."}, {"id": "7", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "Where ___ you from? (be, Präsens)", "answer": "are", "explanation": "Die Frage lautet Where are you from?"}, {"id": "8", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "___ is your name? (What/Where)", "answer": "What", "explanation": "Nach dem Namen fragst du mit What."}], "theory": "englisch-theorie-questions-negation.html#niveau-1", "next": "englisch-present-simple-1-oberstufe.html", "nextReason": "Hier erweiterst du deine Grammatik mit Present Simple."};</script><script src="english-engine.js?v=20261017-1"></script></body></html>
