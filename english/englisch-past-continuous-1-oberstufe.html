ou gehört were."}, {"id": "7", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "It was ___ all afternoon. (rain)", "answer": "raining", "explanation": "Was raining beschreibt hier den Verlauf."}, {"id": "8", "type": "write", "q": "Ergänze die Lücke. Beachte den Hinweis in Klammern.", "ctx": "The children were ___ outside. (run)", "answer": "running", "explanation": "Run wird mit doppeltem n zu running."}], "theory": "englisch-theorie-past-continuous.html#niveau-1", "next": "englisch-present-perfect-1-oberstufe.html", "nextReason": "Hier erweiterst du deine Grammatik mit Present Perfect."};</script><script src="english-engine.js?v=en1"></script></body></html>
