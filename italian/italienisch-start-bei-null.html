</style><script src="learning-core.js?v=20261015-beginner1"></script><script src="italian-answer-check.js?v=20261015-beginner1"></script><script defer src="italian-navigation.js?v=20261015-beginner1"></script></head><body><nav id="navbar"><a href="main.html">Italienisch lernen</a><a href="main.html#hero">Startseite</a></nav><main id="beginnerApp"><h1>Dein Einstieg wird geladen …</h1><p>Sechs kurze Lektionen ohne Vorkenntnisse.</p></main><script id="italianBeginnerData" type="application/json">[{"title": "Begrüssen und sich vorstellen", "goal": "Du kannst jemanden begrüssen und deinen Namen sagen.", "vocab": [["Ciao!", "Hallo! / Tschüss! (vertraut)"], ["Buongiorno.", "Guten Tag. / Guten Morgen."], ["Mi chiamo Giulia.", "Ich heisse Giulia."], ["Come ti chiami?", "Wie heisst du?"]], "dialog": [["Giulia", "Ciao! Mi chiamo Giulia. Come ti chiami?", "Hallo! Ich heisse Giulia. Wie heisst du?"], ["Luca", "Ciao, mi chiamo Luca.", "Hallo, ich heisse Luca."]], "rule": "Mit „Mi chiamo …“ sagst du deinen Namen. Lerne den Ausdruck zunächst als ganzen Baustein. „Ciao“ passt zu Menschen, mit denen du vertraut bist. Mit „Buongiorno“ kannst du jemanden tagsüber höflich begrüssen.", "choices": [{"q": "Welcher Ausdruck bedeutet unter Freunden „Hallo“ oder „Tschüss“?", "options": ["Ciao!", "Grazie.", "Buongiorno."], "answer": "Ciao!", "why": "„Ciao“ ist eine vertraute Begrüssung und Verabschiedung. „Grazie“ heisst „Danke“, „Buongiorno“ ist eine höfliche Begrüssung am Tag."}, {"q": "Welcher Satz bedeutet „Ich heisse Giulia“?", "options": ["Mi chiamo Giulia.", "Ti chiami Giulia.", "Come ti chiami?"], "answer": "Mi chiamo Giulia.", "why": "„Mi chiamo“ verwendest du für deinen eigenen Namen. „Ti chiami“ bezieht sich auf die andere Person."}], "write": {"q": "Ergänze das fehlende Wort: Ich heisse Giulia.", "ctx": "Mi ___ Giulia.", "answer": "chiamo", "why": "Der ganze Satz lautet „Mi chiamo Giulia.“"}, "personal": "Sage laut Hallo und stelle dich mit deinem eigenen Vornamen vor.", "model": "Ciao! Mi chiamo Giulia.", "vocabularyTip": true}, {"title": "Nach dem Befinden fragen", "goal": "Du kannst nach dem Befinden fragen und kurz antworten.", "vocab": [["Come stai?", "Wie geht es dir?"], ["Sto bene.", "Mir geht es gut."], ["Sto male.", "Mir geht es schlecht."], ["Grazie. E tu?", "Danke. Und dir?"]], "dialog": [["Giulia", "Ciao, Luca! Come stai?", "Hallo, Luca! Wie geht es dir?"], ["Luca", "Sto bene, grazie. E tu?", "Mir geht es gut, danke. Und dir?"]], "rule": "„Come stai?“ ist eine Frage an eine Person, die du duzt. Mit „Sto bene“ antwortest du „Mir geht es gut“. „Sto“ und „stai“ sind Formen von „stare“. Du brauchst noch keine vollständige Verbtabelle.", "choices": [{"q": "Wie fragst du „Wie geht es dir“?", "options": ["Come stai?", "Come ti chiami?", "Buongiorno."], "answer": "Come stai?", "why": "„Come stai?“ fragt nach dem Befinden, „Come ti chiami?“ nach dem Namen."}, {"q": "Welche Antwort bedeutet „Mir geht es gut“?", "options": ["Sto bene.", "Sto male.", "Mi chiamo Giulia."], "answer": "Sto bene.", "why": "„Bene“ bedeutet hier „gut“, „male“ bedeutet „schlecht“."}], "write": {"q": "Ergänze: Mir geht es gut.", "ctx": "___ bene.", "answer": "Sto", "why": "„Sto bene“ ist eine vollständige kurze Antwort auf „Come stai?“. Ein zusätzliches „io“ ist nicht nötig."}, "personal": "Frage laut nach dem Befinden. Antworte so, wie es dir gerade geht, und bedanke dich.", "model": "Come stai? — Sto bene, grazie."}, {"title": "Zahlen und Alter", "goal": "Du kannst einige Zahlen verstehen und dein Alter nennen.", "vocab": [["uno, due, tre, quattro, cinque", "eins, zwei, drei, vier, fünf"], ["sei, sette, otto, nove, dieci", "sechs, sieben, acht, neun, zehn"], ["venti, ventuno, ventidue", "zwanzig, einundzwanzig, zweiundzwanzig"], ["Ho venti anni.", "Ich bin zwanzig Jahre alt."], ["Quanti anni hai?", "Wie alt bist du?"]], "dialog": [["Giulia", "Quanti anni hai?", "Wie alt bist du?"], ["Luca", "Ho venti anni. E tu?", "Ich bin zwanzig Jahre alt. Und du?"], ["Giulia", "Ho ventidue anni.", "Ich bin zweiundzwanzig Jahre alt."]], "rule": "Beim Alter verwendet Italienisch „avere“ (haben): „Ho venti anni.“ Wörtlich bedeutet das „Ich habe zwanzig Jahre“. „Ho“ steht für „ich habe“, „hai“ für „du hast“. Das h wird nicht gesprochen. „Vent’anni“ ist ebenfalls eine übliche Schreibweise für „venti anni“.", "choices": [{"q": "Welche Zahl bedeutet „drei“?", "options": ["tre", "due", "dieci"], "answer": "tre", "why": "„Tre“ heisst „drei“, „due“ heisst „zwei“ und „dieci“ heisst „zehn“."}, {"q": "Welcher Satz bedeutet „Ich bin zwanzig Jahre alt“?", "options": ["Ho venti anni.", "Sono venti anni.", "Mi chiamo venti."], "answer": "Ho venti anni.", "why": "Für das Alter brauchst du „ho“, nicht „sono“."}], "write": {"q": "Ergänze: Ich bin zwanzig Jahre alt.", "ctx": "___ venti anni.", "answer": "Ho", "why": "Der Satz lautet „Ho venti anni.“ Das h in „ho“ wird geschrieben, aber nicht gesprochen.", "accepted": ["Ho vent’anni."]}, "personal": "Sage dein Alter. Du darfst eine Zahl aus den Beispielen benutzen. Für andere Zahlen hilft die Zahlenübersicht.", "model": "Ho venti anni.", "numbers": true}, {"title": "Über Familie sprechen", "goal": "Du kannst eine Person aus deiner Familie vorstellen.", "vocab": [["mia madre", "meine Mutter"], ["mio padre", "mein Vater"], ["mia sorella", "meine Schwester"], ["mio fratello", "mein Bruder"], ["Questa è mia sorella.", "Das ist meine Schwester."]], "dialog": [["Giulia", "Questa è mia sorella. Si chiama Sara.", "Das ist meine Schwester. Sie heisst Sara."], ["Luca", "Ciao, Sara!", "Hallo, Sara!"]], "rule": "„Mio“ und „mia“ bedeuten hier „mein/meine“. Bei diesen einzelnen Familienwörtern steht normalerweise kein Artikel: „mio fratello“, „mia sorella“. „Questo è …“ stellt hier eine männliche Person vor, „Questa è …“ eine weibliche. „È“ ist eine Form von „essere“ (sein).", "choices": [{"q": "Was bedeutet „mia madre“?", "options": ["meine Mutter", "mein Bruder", "meine Schwester"], "answer": "meine Mutter", "why": "„Madre“ bedeutet „Mutter“, „fratello“ bedeutet „Bruder“ und „sorella“ bedeutet „Schwester“."}, {"q": "Wie stellst du deinen Bruder vor?", "options": ["Questo è mio fratello.", "Questa è mia sorella.", "Sto bene."], "answer": "Questo è mio fratello.", "why": "„Questo è mio fratello“ bedeutet „Das ist mein Bruder“."}], "write": {"q": "Ergänze: Das ist meine Schwester. Achte auf den Akzent.", "ctx": "Questa ___ mia sorella.", "answer": "è", "why": "„È“ mit Akzent bedeutet „ist“. „E“ ohne Akzent bedeutet „und“ und wäre hier falsch."}, "personal": "Stelle eine Person aus deiner Familie vor. Du kannst auch eine Person erfinden.", "model": "Questa è mia sorella. Si chiama Sara."}, {"title": "Einfache Wünsche ausdrücken", "goal": "Du kannst höflich um etwas bitten und dich bedanken.", "vocab": [["Vorrei dell’acqua.", "Ich hätte gern Wasser."], ["un caffè", "einen Kaffee"], ["per favore", "bitte"], ["grazie", "danke"], ["Vorrei un caffè.", "Ich hätte gern einen Kaffee."]], "dialog": [["Giulia", "Buongiorno. Vorrei un caffè, per favore.", "Guten Tag. Ich hätte gern einen Kaffee, bitte."], ["Luca", "Ecco.", "Hier, bitte."], ["Giulia", "Grazie.", "Danke."]], "rule": "„Vorrei …“ ist eine höfliche Möglichkeit, um etwas zu bitten. Du kannst den Ausdruck zunächst als festen Baustein lernen. „Per favore“ heisst „bitte“. In „caffè“ gehört der Akzent zum Wort.", "choices": [{"q": "Welcher Ausdruck bedeutet bei einer Bitte „bitte“?", "options": ["per favore", "grazie", "buongiorno"], "answer": "per favore", "why": "Bei einer Bitte sagst du „per favore“. Mit „grazie“ bedankst du dich."}, {"q": "Wie bestellst du höflich einen Kaffee?", "options": ["Vorrei un caffè, per favore.", "Mi chiamo caffè.", "Ho venti anni."], "answer": "Vorrei un caffè, per favore.", "why": "„Vorrei un caffè, per favore“ ist eine höfliche Bestellung."}], "write": {"q": "Ergänze die höfliche Bestellung eines Kaffees.", "ctx": "Vorrei un caffè, per ___.", "answer": "favore", "why": "„Per favore“ ist ein fester Ausdruck für „bitte“."}, "personal": "Bitte laut um Wasser oder einen Kaffee und bedanke dich.", "model": "Vorrei un caffè, per favore. Grazie."}, {"title": "Dein erster kurzer Dialog", "goal": "Du verbindest Begrüssung, Name, Befinden und eine Bitte.", "vocab": [["Ciao! Mi chiamo Giulia.", "Hallo! Ich heisse Giulia."], ["Sto bene, grazie.", "Mir geht es gut, danke."], ["E tu?", "Und dir?"], ["Vorrei dell’acqua, per favore.", "Ich hätte gern Wasser, bitte."]], "dialog": [["Giulia", "Ciao! Mi chiamo Giulia. Come ti chiami?", "Hallo! Ich heisse Giulia. Wie heisst du?"], ["Luca", "Mi chiamo Luca. Come stai?", "Ich heisse Luca. Wie geht es dir?"], ["Giulia", "Sto bene, grazie. E tu?", "Mir geht es gut, danke. Und dir?"], ["Luca", "Bene, grazie.", "Gut, danke."], ["Giulia", "Vorrei dell’acqua, per favore.", "Ich hätte gern Wasser, bitte."]], "rule": "Du kennst bereits mehrere Satzbausteine. „Mi chiamo“ nennt deinen Namen, „sto“ beschreibt hier dein Befinden, „ho“ nennt dein Alter und „è“ stellt jemanden vor. Du musst noch keine vollständigen Verbtabellen auswendig können.", "choices": [{"q": "Wie heisst die zweite Person im Dialog?", "options": ["Luca", "Giulia", "Sara"], "answer": "Luca", "why": "Die zweite Person sagt „Mi chiamo Luca“. Du findest die Antwort im Dialog."}, {"q": "Worum bittet Giulia am Schluss?", "options": ["um Wasser", "um Kaffee", "um eine Fahrkarte"], "answer": "um Wasser", "why": "Giulia sagt „Vorrei dell’acqua“. Das ist eine Bitte um Wasser."}], "write": {"q": "Ergänze: Mir geht es gut, danke.", "ctx": "Sto bene, ___.", "answer": "grazie", "why": "Mit „grazie“ bedankst du dich."}, "personal": "Sprich einen kurzen Dialog: Begrüsse jemanden, nenne deinen Namen, frage nach dem Befinden und formuliere eine Bitte. Du kannst beide Rollen selbst sprechen.", "model": "Ciao! Mi chiamo Giulia. Come stai? — Sto bene, grazie. Vorrei dell’acqua, per favore."}]</script><script src="italienisch-start-bei-null.js?v=20261015-4"></script></body></html>
