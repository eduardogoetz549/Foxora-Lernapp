</style><script src="learning-core.js?v=20261015-beginner1"></script><script src="french-answer-check.js?v=20261015-beginner1"></script><script defer src="french-navigation.js?v=20261015-beginner1"></script></head><body><nav id="navbar"><a href="main.html">Französisch lernen</a><a href="main.html#hero">Startseite</a></nav><main id="beginnerApp"><h1>Dein Einstieg wird geladen …</h1><p>Sechs kurze Lektionen ohne Vorkenntnisse.</p></main><script id="frenchBeginnerData" type="application/json">[{"title": "Begrüssen und sich vorstellen", "goal": "Du kannst jemanden begrüssen und deinen Namen sagen.", "vocab": [["Bonjour !", "Guten Tag! / Hallo!"], ["Salut !", "Hallo! / Tschüss! (vertraut)"], ["Je m’appelle Léa.", "Ich heisse Léa."], ["Comment tu t’appelles ?", "Wie heisst du?"]], "dialog": [["Léa", "Bonjour ! Je m’appelle Léa. Comment tu t’appelles ?", "Hallo! Ich heisse Léa. Wie heisst du?"], ["Noé", "Salut ! Je m’appelle Noé.", "Hallo! Ich heisse Noé."]], "rule": "Mit „Je m’appelle …“ sagst du deinen Namen. Lerne den Ausdruck zunächst als ganzen Baustein. „Bonjour“ passt auch zu Menschen, die du noch nicht kennst. „Salut“ ist vertrauter und passt etwa zu Freunden.", "choices": [{"q": "Wie begrüsst du jemanden tagsüber höflich?", "options": ["Bonjour !", "Merci.", "Au revoir."], "answer": "Bonjour !", "why": "„Bonjour“ ist eine Begrüssung. „Merci“ heisst „Danke“, „Au revoir“ heisst „Auf Wiedersehen“."}, {"q": "Welcher Satz bedeutet „Ich heisse Léa“?", "options": ["Je m’appelle Léa.", "Tu t’appelles Léa.", "Comment tu t’appelles ?"], "answer": "Je m’appelle Léa.", "why": "„Je m’appelle“ verwendest du für deinen eigenen Namen. „Tu t’appelles“ bezieht sich auf die andere Person."}], "write": {"q": "Ergänze das fehlende Wort: Ich heisse Léa.", "ctx": "Je m’___ Léa.", "answer": "appelle", "why": "Der ganze Satz lautet „Je m’appelle Léa.“ Der Apostroph verbindet „m’“ mit dem folgenden Wort."}, "personal": "Sage laut Hallo und stelle dich mit deinem eigenen Vornamen vor.", "model": "Bonjour ! Je m’appelle Léa.", "vocabularyTip": true}, {"title": "Nach dem Befinden fragen", "goal": "Du kannst nach dem Befinden fragen und kurz antworten.", "vocab": [["Ça va ?", "Wie geht’s?"], ["Ça va bien.", "Mir geht es gut."], ["Ça va mal.", "Mir geht es schlecht."], ["Merci. Et toi ?", "Danke. Und dir?"]], "dialog": [["Léa", "Salut, Noé ! Ça va ?", "Hallo, Noé! Wie geht’s?"], ["Noé", "Ça va bien, merci. Et toi ?", "Mir geht es gut, danke. Und dir?"]], "rule": "„Ça va ?“ ist eine kurze Frage nach dem Befinden. Mit „Ça va bien“ kannst du antworten. Im Text zeigt das Fragezeichen die Frage; beim Sprechen hilft die Betonung. „Toi“ verwendest du hier bei jemandem, den du duzt.", "choices": [{"q": "Wie fragst du kurz „Wie geht’s“?", "options": ["Ça va ?", "Comment tu t’appelles ?", "Au revoir."], "answer": "Ça va ?", "why": "„Ça va ?“ fragt nach dem Befinden. „Comment tu t’appelles ?“ fragt nach dem Namen."}, {"q": "Welche Antwort bedeutet „Mir geht es gut“?", "options": ["Ça va bien.", "Ça va mal.", "Je m’appelle Léa."], "answer": "Ça va bien.", "why": "„Bien“ bedeutet hier „gut“, „mal“ bedeutet „schlecht“."}], "write": {"q": "Ergänze: Mir geht es gut.", "ctx": "Ça va ___.", "answer": "bien", "why": "„Ça va bien“ ist eine kurze Antwort auf „Ça va ?“. „Ça“ wird mit ç geschrieben."}, "personal": "Frage laut nach dem Befinden. Antworte so, wie es dir gerade geht, und bedanke dich.", "model": "Ça va ? — Ça va bien, merci."}, {"title": "Zahlen und Alter", "goal": "Du kannst einige Zahlen verstehen und dein Alter nennen.", "vocab": [["un, deux, trois, quatre, cinq", "eins, zwei, drei, vier, fünf"], ["six, sept, huit, neuf, dix", "sechs, sieben, acht, neun, zehn"], ["vingt, vingt et un, vingt-deux", "zwanzig, einundzwanzig, zweiundzwanzig"], ["J’ai vingt ans.", "Ich bin zwanzig Jahre alt."], ["Tu as quel âge ?", "Wie alt bist du?"]], "dialog": [["Léa", "Tu as quel âge ?", "Wie alt bist du?"], ["Noé", "J’ai vingt ans. Et toi ?", "Ich bin zwanzig Jahre alt. Und du?"], ["Léa", "J’ai vingt-deux ans.", "Ich bin zweiundzwanzig Jahre alt."]], "rule": "Beim Alter verwendet Französisch „avoir“ (haben): „J’ai vingt ans.“ Wörtlich bedeutet das „Ich habe zwanzig Jahre“. „J’ai“ steht für „ich habe“, „tu as“ für „du hast“. Vor einem Vokal wird aus „je“ hier „j’“.", "choices": [{"q": "Welche Zahl bedeutet „drei“?", "options": ["trois", "deux", "dix"], "answer": "trois", "why": "„Trois“ heisst „drei“, „deux“ heisst „zwei“ und „dix“ heisst „zehn“."}, {"q": "Welcher Satz bedeutet „Ich bin zwanzig Jahre alt“?", "options": ["J’ai vingt ans.", "Je suis vingt ans.", "Je m’appelle vingt."], "answer": "J’ai vingt ans.", "why": "Für das Alter brauchst du „j’ai“, nicht „je suis“."}], "write": {"q": "Ergänze: Ich bin zwanzig Jahre alt.", "ctx": "J’___ vingt ans.", "answer": "ai", "why": "Der Satz lautet „J’ai vingt ans.“"}, "personal": "Sage dein Alter. Du darfst eine Zahl aus den Beispielen benutzen. Für andere Zahlen hilft die Zahlenübersicht.", "model": "J’ai vingt ans.", "numbers": true}, {"title": "Über Familie sprechen", "goal": "Du kannst eine Person aus deiner Familie vorstellen.", "vocab": [["ma mère", "meine Mutter"], ["mon père", "mein Vater"], ["ma sœur", "meine Schwester"], ["mon frère", "mein Bruder"], ["C’est ma sœur.", "Das ist meine Schwester."]], "dialog": [["Léa", "C’est ma sœur. Elle s’appelle Emma.", "Das ist meine Schwester. Sie heisst Emma."], ["Noé", "Bonjour, Emma !", "Hallo, Emma!"]], "rule": "„Mon“ und „ma“ bedeuten hier „mein/meine“. Bei diesen Wörtern steht „mon“ vor dem männlichen Familienwort und „ma“ vor dem weiblichen: „mon frère“, „ma sœur“. „C’est …“ bedeutet „Das ist …“. „Est“ ist eine Form von „être“ (sein).", "choices": [{"q": "Was bedeutet „ma mère“?", "options": ["meine Mutter", "mein Bruder", "meine Schwester"], "answer": "meine Mutter", "why": "„Mère“ bedeutet „Mutter“. „Frère“ ist „Bruder“, „sœur“ ist „Schwester“."}, {"q": "Wie stellst du deinen Bruder vor?", "options": ["C’est mon frère.", "C’est ma sœur.", "Ça va bien."], "answer": "C’est mon frère.", "why": "„C’est mon frère“ bedeutet „Das ist mein Bruder“."}], "write": {"q": "Ergänze: Das ist meine Schwester.", "ctx": "C’___ ma sœur.", "answer": "est", "why": "„C’est ma sœur“ stellt deine Schwester vor. „Est“ gehört zum Verb „être“."}, "personal": "Stelle eine Person aus deiner Familie vor. Du kannst auch eine Person erfinden.", "model": "C’est ma sœur. Elle s’appelle Emma."}, {"title": "Einfache Wünsche ausdrücken", "goal": "Du kannst höflich um etwas bitten und dich bedanken.", "vocab": [["Je voudrais de l’eau.", "Ich hätte gern Wasser."], ["un café", "einen Kaffee"], ["s’il vous plaît", "bitte (höflich)"], ["merci", "danke"], ["Je voudrais un café.", "Ich hätte gern einen Kaffee."]], "dialog": [["Léa", "Bonjour. Je voudrais un café, s’il vous plaît.", "Guten Tag. Ich hätte gern einen Kaffee, bitte."], ["Noé", "Voilà.", "Hier, bitte."], ["Léa", "Merci.", "Danke."]], "rule": "„Je voudrais …“ ist eine höfliche Möglichkeit, etwas zu bestellen. Du kannst den Ausdruck zunächst als festen Baustein lernen. Mit „s’il vous plaît“ sprichst du eine Person höflich an; zu jemandem, den du duzt, passt „s’il te plaît“.", "choices": [{"q": "Welcher Ausdruck bedeutet bei einer höflichen Bitte „bitte“?", "options": ["s’il vous plaît", "merci", "au revoir"], "answer": "s’il vous plaît", "why": "Bei einer höflichen Bitte sagst du „s’il vous plaît“. Mit „merci“ bedankst du dich."}, {"q": "Wie bestellst du höflich einen Kaffee?", "options": ["Je voudrais un café, s’il vous plaît.", "Je m’appelle café.", "J’ai vingt ans."], "answer": "Je voudrais un café, s’il vous plaît.", "why": "„Je voudrais un café, s’il vous plaît“ ist eine höfliche Bestellung."}], "write": {"q": "Ergänze die höfliche Bestellung eines Kaffees.", "ctx": "Je ___ un café, s’il vous plaît.", "answer": "voudrais", "why": "„Je voudrais“ bedeutet „Ich hätte gern“."}, "personal": "Bitte laut um Wasser oder einen Kaffee und bedanke dich.", "model": "Je voudrais un café, s’il vous plaît. Merci."}, {"title": "Dein erster kurzer Dialog", "goal": "Du verbindest Begrüssung, Name, Befinden und eine Bitte.", "vocab": [["Bonjour ! Je m’appelle Léa.", "Hallo! Ich heisse Léa."], ["Ça va bien, merci.", "Mir geht es gut, danke."], ["Et toi ?", "Und dir?"], ["Je voudrais de l’eau, s’il vous plaît.", "Ich hätte gern Wasser, bitte."]], "dialog": [["Léa", "Bonjour ! Je m’appelle Léa. Comment tu t’appelles ?", "Hallo! Ich heisse Léa. Wie heisst du?"], ["Noé", "Je m’appelle Noé. Ça va ?", "Ich heisse Noé. Wie geht’s?"], ["Léa", "Ça va bien, merci. Et toi ?", "Mir geht es gut, danke. Und dir?"], ["Noé", "Bien, merci.", "Gut, danke."], ["Léa", "Je voudrais de l’eau, s’il te plaît.", "Ich hätte gern Wasser, bitte."]], "rule": "Du kennst bereits mehrere Satzbausteine. „Je m’appelle“ nennt deinen Namen, „ça va“ beschreibt hier dein Befinden, „j’ai“ nennt dein Alter und „c’est“ stellt jemanden vor. Im Gespräch mit Noé verwendet Léa das vertraute „s’il te plaît“ statt der höflichen Anrede „s’il vous plaît“.", "choices": [{"q": "Wie heisst die zweite Person im Dialog?", "options": ["Noé", "Léa", "Emma"], "answer": "Noé", "why": "Die zweite Person sagt „Je m’appelle Noé“. Du findest die Antwort im Dialog."}, {"q": "Worum bittet Léa am Schluss?", "options": ["um Wasser", "um Kaffee", "um eine Fahrkarte"], "answer": "um Wasser", "why": "Léa sagt „Je voudrais de l’eau“. Das ist eine Bitte um Wasser."}], "write": {"q": "Ergänze: Mir geht es gut, danke.", "ctx": "Ça va bien, ___.", "answer": "merci", "why": "Mit „merci“ bedankst du dich."}, "personal": "Sprich einen kurzen Dialog: Begrüsse jemanden, nenne deinen Namen, frage nach dem Befinden und formuliere eine Bitte. Du kannst beide Rollen selbst sprechen.", "model": "Salut ! Je m’appelle Léa. Ça va ? — Ça va bien, merci. Je voudrais de l’eau, s’il te plaît."}]</script><script src="franzoesisch-start-bei-null.js?v=20261015-5"></script></body></html>
