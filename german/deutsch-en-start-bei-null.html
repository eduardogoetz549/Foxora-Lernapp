t-align:left;width:100%;margin:10px 0;background:#f5f6fb;border:1px solid #c9d0e4;color:#17213d}.beginner-option:hover{border-color:#987038;background:#f7f0df}button:disabled{opacity:.6;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #7654b8;outline-offset:3px}.beginner-dialog{border-left:3px solid #b79440;padding:2px 16px;margin:12px 0}.beginner-dialog p{margin:6px 0}.beginner-dialog p:first-child{font-weight:600}.beginner-dialog p:last-child{color:#566078}.beginner-rule,.beginner-feedback{padding:18px;background:#f7f0df;border-radius:10px;margin-top:20px}.beginner-feedback[hidden]{display:none}.beginner-gap{font-size:25px}.beginner-card label{display:block;margin:18px 0 8px}.beginner-card input:not([type=checkbox]){display:block;width:100%;max-width:540px;min-height:48px;padding:12px;font:inherit;border:1px solid #8a96b6;border-radius:8px}.beginner-card input[type=checkbox]{width:20px;height:20px;vertical-align:middle}.beginner-link{display:inline-block;color:#d4af60;text-decoration:underline;margin:10px 12px 10px 0}.beginner-card .beginner-link{color:#604817}.beginner-card details{margin:18px 0}.beginner-card summary{cursor:pointer;font-weight:600}main p,main h1,button{overflow-wrap:anywhere}@media(max-width:600px){main{padding:22px 14px 50px}.beginner-vocab{grid-template-columns:1fr auto}.beginner-vocab span{grid-column:1}.beginner-vocab button{grid-column:2;grid-row:1/3}.beginner-lesson{flex:1 1 45%;font-size:13px}.beginner-link{max-width:100%}}

</style><script src="german-learning-core.js?v=20261015-beginner1"></script><script src="german-answer-check.js?v=20261015-beginner1"></script><script defer src="german-navigation.js?v=20261015-beginner1"></script></head><body><nav id="navbar"><a href="main.html">Learn German</a><a href="main.html#hero">Home</a></nav><main id="beginnerApp"><h1>Loading your introduction …</h1><p>Six short lessons with no previous knowledge needed.</p></main><script id="germanBeginnerData" type="application/json">[{"title": "Greetings and introductions", "goal": "You can greet someone and say your name.", "vocab": [["Hallo!", "Hello!"], ["Guten Morgen.", "Good morning."], ["Ich heiße Anna.", "My name is Anna."], ["Wie heißt du?", "What is your name?"]], "dialog": [["Anna", "Hallo! Ich heiße Anna. Wie heißt du?", "Hello! My name is Anna. What is your name?"], ["Lukas", "Hallo, ich heiße Lukas.", "Hello, my name is Lukas."]], "rule": "Use “Ich heiße …” to say your name. Learn it as a whole phrase first. “Du” is the informal word for “you”. In Switzerland, “heiße” is written “heisse”; both spellings are accepted here.", "choices": [{"q": "Which expression means “Hello”?", "options": ["Hallo!", "Danke.", "Auf Wiedersehen."], "answer": "Hallo!", "why": "“Hallo” is a greeting. “Danke” means “Thank you”; “Auf Wiedersehen” means “Goodbye”."}, {"q": "Which sentence means “My name is Anna”?", "options": ["Ich heiße Anna.", "Du heißt Anna.", "Wie heißt du?"], "answer": "Ich heiße Anna.", "why": "Use “Ich heiße” for your own name. “Du heißt” refers to the other person."}], "write": {"q": "Complete the missing word: My name is Anna.", "ctx": "Ich ___ Anna.", "answer": "heiße", "accepted": ["heisse"], "why": "The complete sentence is “Ich heiße Anna.” The Swiss spelling “Ich heisse Anna” is also correct."}, "personal": "Say hello aloud and introduce yourself using your own first name.", "model": "Hallo! Ich heiße Anna.", "vocabularyTip": true}, {"title": "Asking how someone is", "goal": "You can ask how someone is and give a short answer.", "vocab": [["Wie geht es dir?", "How are you?"], ["Mir geht es gut.", "I am well."], ["Mir geht es schlecht.", "I am not well."], ["Danke. Und dir?", "Thank you. And you?"]], "dialog": [["Anna", "Hallo, Lukas! Wie geht es dir?", "Hello, Lukas! How are you?"], ["Lukas", "Mir geht es gut, danke. Und dir?", "I am well, thank you. And you?"]], "rule": "“Wie geht es dir?” asks how someone is, using informal “you”. You can answer “Mir geht es gut”. Learn this phrase as a whole for now: you do not need to understand every grammar rule yet.", "choices": [{"q": "How do you ask “How are you?” informally?", "options": ["Wie geht es dir?", "Wie heißt du?", "Guten Morgen."], "answer": "Wie geht es dir?", "why": "“Wie geht es dir?” asks how someone is. “Wie heißt du?” asks for their name."}, {"q": "Which answer means “I am well”?", "options": ["Mir geht es gut.", "Mir geht es schlecht.", "Ich heiße Anna."], "answer": "Mir geht es gut.", "why": "“Gut” means “well/good” here. “Mir geht es schlecht” means that you are not well."}], "write": {"q": "Complete: I am well.", "ctx": "Mir geht es ___.", "answer": "gut", "why": "“Mir geht es gut” is a complete short answer to “Wie geht es dir?”."}, "personal": "Ask aloud how someone is. Answer according to how you feel and say thank you.", "model": "Wie geht es dir? — Mir geht es gut, danke."}, {"title": "Numbers and age", "goal": "You can understand a few numbers and say your age.", "vocab": [["eins, zwei, drei, vier, fünf", "one, two, three, four, five"], ["sechs, sieben, acht, neun, zehn", "six, seven, eight, nine, ten"], ["zwanzig, einundzwanzig, zweiundzwanzig", "twenty, twenty-one, twenty-two"], ["Ich bin zwanzig Jahre alt.", "I am twenty years old."], ["Wie alt bist du?", "How old are you?"]], "dialog": [["Anna", "Wie alt bist du?", "How old are you?"], ["Lukas", "Ich bin zwanzig Jahre alt. Und du?", "I am twenty years old. And you?"], ["Anna", "Ich bin zweiundzwanzig Jahre alt.", "I am twenty-two years old."]], "rule": "For age, German uses “sein” (to be), as English does: “Ich bin zwanzig Jahre alt.” “Bin” means “am” after “ich”, while “bist” means “are” after “du”. In numbers such as “einundzwanzig”, the unit comes before the tens: one-and-twenty.", "choices": [{"q": "Which word means “three”?", "options": ["drei", "zwei", "zehn"], "answer": "drei", "why": "“Drei” is “three”, “zwei” is “two” and “zehn” is “ten”."}, {"q": "Which sentence means “I am twenty years old”?", "options": ["Ich bin zwanzig Jahre alt.", "Ich habe zwanzig Jahre alt.", "Ich heiße zwanzig."], "answer": "Ich bin zwanzig Jahre alt.", "why": "Use “ich bin” to say your age. “Ich habe” means “I have” and does not fit this sentence."}], "write": {"q": "Complete: I am twenty years old.", "ctx": "Ich ___ zwanzig Jahre alt.", "answer": "bin", "why": "The sentence is “Ich bin zwanzig Jahre alt.”"}, "personal": "Say your age aloud. You may use a number from the examples. Use the numbers overview to look up other numbers.", "model": "Ich bin zwanzig Jahre alt.", "numbers": true}, {"title": "Talking about family", "goal": "You can introduce a member of your family.", "vocab": [["meine Mutter", "my mother"], ["mein Vater", "my father"], ["meine Schwester", "my sister"], ["mein Bruder", "my brother"], ["Das ist meine Schwester.", "This is my sister."]], "dialog": [["Anna", "Das ist meine Schwester. Sie heißt Emma.", "This is my sister. Her name is Emma."], ["Lukas", "Hallo, Emma!", "Hello, Emma!"]], "rule": "“Mein” and “meine” both mean “my”. In these phrases, use “mein” with “Vater/Bruder” and “meine” with “Mutter/Schwester”. German nouns start with a capital letter. “Das ist …” introduces someone; “ist” is another form of “sein” (to be).", "choices": [{"q": "What does “meine Mutter” mean?", "options": ["my mother", "my brother", "my sister"], "answer": "my mother", "why": "“Mutter” means “mother”, “Bruder” means “brother”, and “Schwester” means “sister”."}, {"q": "How do you introduce your brother?", "options": ["Das ist mein Bruder.", "Das ist meine Schwester.", "Mir geht es gut."], "answer": "Das ist mein Bruder.", "why": "“Das ist mein Bruder” means “This is my brother”."}], "write": {"q": "Complete: This is my sister.", "ctx": "Das ___ meine Schwester.", "answer": "ist", "why": "The sentence is “Das ist meine Schwester.” Use “ist” in this phrase."}, "personal": "Introduce a member of your family aloud. You may invent a person if you prefer.", "model": "Das ist meine Schwester. Sie heißt Emma."}, {"title": "Making simple requests", "goal": "You can ask for something politely and say thank you.", "vocab": [["Ich möchte Wasser.", "I would like water."], ["einen Kaffee", "a coffee (in this request)"], ["bitte", "please"], ["danke", "thank you"], ["Ich möchte einen Kaffee.", "I would like a coffee."]], "dialog": [["Anna", "Guten Morgen. Ich möchte einen Kaffee, bitte.", "Good morning. I would like a coffee, please."], ["Lukas", "Bitte schön.", "Here you are."], ["Anna", "Danke.", "Thank you."]], "rule": "“Ich möchte …” is a polite way to say what you would like. Learn it as a phrase for now. Use “bitte” for “please” and “danke” for “thank you”. The umlaut matters: “möchte” means “would like”; “mochte” means “liked” in the past.", "choices": [{"q": "Which word means “please” in a request?", "options": ["bitte", "danke", "hallo"], "answer": "bitte", "why": "Use “bitte” for “please”. Say “danke” to thank someone."}, {"q": "How do you ask for a coffee politely?", "options": ["Ich möchte einen Kaffee, bitte.", "Ich heiße Kaffee.", "Ich bin zwanzig Jahre alt."], "answer": "Ich möchte einen Kaffee, bitte.", "why": "“Ich möchte einen Kaffee, bitte” is a polite request for a coffee."}], "write": {"q": "Complete the polite request. Remember the umlaut.", "ctx": "Ich ___ einen Kaffee, bitte.", "answer": "möchte", "why": "“Möchte” needs ö here. “Ich mochte” without the umlaut means “I liked”."}, "personal": "Ask aloud for water or a coffee, and say thank you.", "model": "Ich möchte einen Kaffee, bitte. Danke."}, {"title": "Your first short dialogue", "goal": "You can combine a greeting, your name, how you feel and a request.", "vocab": [["Hallo! Ich heiße Anna.", "Hello! My name is Anna."], ["Mir geht es gut, danke.", "I am well, thank you."], ["Und dir?", "And you?"], ["Ich möchte Wasser, bitte.", "I would like water, please."]], "dialog": [["Anna", "Hallo! Ich heiße Anna. Wie heißt du?", "Hello! My name is Anna. What is your name?"], ["Lukas", "Ich heiße Lukas. Wie geht es dir?", "My name is Lukas. How are you?"], ["Anna", "Mir geht es gut, danke. Und dir?", "I am well, thank you. And you?"], ["Lukas", "Gut, danke.", "Well, thank you."], ["Anna", "Ich möchte Wasser, bitte.", "I would like water, please."]], "rule": "You already know several useful phrases. “Ich heiße” gives your name, “Mir geht es …” describes how you feel, “ich bin” gives your age and “das ist” introduces someone. You do not need to memorise complete verb tables yet.", "choices": [{"q": "What is the name of the second person in the dialogue?", "options": ["Lukas", "Anna", "Emma"], "answer": "Lukas", "why": "The second person says “Ich heiße Lukas”. You can find the answer in the dialogue."}, {"q": "What does Anna ask for at the end?", "options": ["water", "coffee", "a train ticket"], "answer": "water", "why": "Anna says “Ich möchte Wasser”. “Wasser” means “water”."}], "write": {"q": "Complete: I am well, thank you.", "ctx": "Mir geht es gut, ___.", "answer": "danke", "why": "Say “danke” to thank someone."}, "personal": "Speak a short dialogue: greet someone, say your name, ask how they are and make a request. You may speak both roles yourself.", "model": "Hallo! Ich heiße Anna. Wie geht es dir? — Mir geht es gut, danke. Ich möchte Wasser, bitte."}]</script><script src="deutsch-en-start-bei-null.js?v=20261015-4"></script></body></html>
